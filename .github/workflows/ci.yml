name: CI

on:
  push:
    branches: [pylibsonly]
  pull_request:
    branches: [pylibsonly]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest -v
      - run: uv build
      - run: uvx twine check dist/*

  # Installs a real VirtualBox and checks as much of the real stack as this
  # runner can actually exercise:
  #   1. The vboxdrv kernel driver loads and `VBoxManage --version` works --
  #      this proves VirtualBox itself is functional in CI, not just present.
  #   2. `import vboxapi` succeeds on the system Python VirtualBox's own
  #      package was built against (not just uv's managed interpreters in the
  #      matrix job above).
  #
  # It deliberately stops short of constructing a live VirtualBoxManager()
  # and calling into it. That was the original goal here, but it turned out
  # to hard-segfault (SIGSEGV, uncatchable from Python) inside Oracle's own
  # compiled VBoxPython3_12.so the moment xpcom.vboxxpcom imports it --
  # confirmed via `python -X faulthandler` across several isolated runs on
  # GitHub's actual runners, always at the same point (module import, before
  # any of our code or any real API call runs). That's a limitation of
  # running VirtualBox's native glue in a headless CI sandbox, not a bug in
  # this package -- see the run history on this workflow around 2026-08-10
  # for the full diagnostic trail if this needs revisiting.
  virtualbox-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install VirtualBox
        run: |
          sudo apt-get update
          sudo apt-get install -y virtualbox
      - run: uv sync
      - name: Confirm the driver loaded and the CLI works
        run: |
          lsmod | grep -i vbox
          VBoxManage --version
      - name: Confirm vboxapi imports against VirtualBox's own Python
        env:
          VBOX_PROGRAM_PATH: /usr/lib/virtualbox
          VBOX_SDK_PATH: /usr/lib/virtualbox/sdk
          PYTHONPATH: /usr/lib/virtualbox/sdk/bindings/xpcom/python
          LD_LIBRARY_PATH: /usr/lib/virtualbox
        run: |
          uv run python -c "
          import xpcom
          from vboxapi import VirtualBoxManager, VirtualBoxReflectionInfo
          print('vboxapi + xpcom import OK:', xpcom.__file__)
          "
