name: CI

on:
  push:
    branches: [pylibsonly]
  pull_request:
    branches: [pylibsonly]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest -v
      - run: uv build
      - run: uvx twine check dist/*

  # Best-effort functional smoke test: installs a real VirtualBox and exercises
  # the actual COM/XPCOM dynamic-dispatch path through VirtualBoxManager, which
  # a plain `import vboxapi` can't catch. This is new and unverified against
  # GitHub's real runner environment -- marked non-blocking (continue-on-error)
  # until it's proven reliable there; if it turns out VirtualBox's installed
  # xpcom bindings live somewhere other than the path below, this job will need
  # adjusting rather than the release pipeline being blocked by it.
  virtualbox-smoke-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install VirtualBox
        run: |
          sudo apt-get update
          sudo apt-get install -y virtualbox
      - run: uv sync
      - name: Diagnostics -- confirm the driver + CLI work before touching Python
        run: |
          lsmod | grep -i vbox || echo "vboxdrv not loaded"
          sudo modprobe vboxdrv || echo "modprobe vboxdrv failed"
          lsmod | grep -i vbox || echo "still not loaded after modprobe"
          VBoxManage --version || echo "VBoxManage --version failed"
          echo "--- compiled xpcom extensions shipped by the distro package ---"
          find /usr/lib/virtualbox -iname "*xpcom*" -o -iname "_xpcom*"
          echo "--- shared library resolution for each ---"
          for so in $(find /usr/lib/virtualbox -iname "_xpcom*.so"); do
            echo "== $so =="
            ldd "$so" || true
          done
      - name: Query the running VirtualBox instance through vboxapi
        env:
          VBOX_PROGRAM_PATH: /usr/lib/virtualbox
          VBOX_SDK_PATH: /usr/lib/virtualbox/sdk
          PYTHONPATH: /usr/lib/virtualbox/sdk/bindings/xpcom/python
          # The compiled xpcom extension dlopen()s VBoxXPCOMC.so; without this
          # it doesn't raise ImportError, it segfaults (exit 139) -- see the
          # first CI run of this workflow.
          LD_LIBRARY_PATH: /usr/lib/virtualbox
        run: |
          uv run python -X faulthandler -c "
          print('step 1: importing xpcom directly')
          import xpcom
          print('step 1 OK:', xpcom.__file__)
          print('step 2: importing vboxapi')
          from vboxapi import VirtualBoxManager
          print('step 2 OK')
          print('step 3: constructing VirtualBoxManager')
          mgr = VirtualBoxManager(None, None)
          print('step 3 OK, mgr.type =', mgr.type)
          print('step 4: mgr.vbox')
          vbox = mgr.vbox
          print('step 4 OK')
          print('VirtualBox version reported via vboxapi:', vbox.version)
          print(f'{len(vbox.machines)} machines registered')
          "
